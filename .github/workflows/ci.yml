name: CI

on:
  pull_request:
    paths:
      - "website/site/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "website/site/**"
      - ".github/workflows/ci.yml"

# One run per branch/PR at a time; a new push cancels the one in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: no permissions. Jobs opt in to only what they use.
permissions: {}

defaults:
  run:
    working-directory: website/site

jobs:
  build-and-test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions/checkout v4, resolved 2026-09-22
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v4, resolved 2026-09-22
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: website/site/.nvmrc
          cache: npm
          cache-dependency-path: website/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Cloudflare Workers bundle
        run: npx opennextjs-cloudflare build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4, resolved 2026-09-22
        with:
          name: playwright-report
          path: website/site/playwright-report/
          retention-days: 14

  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: website/site/.nvmrc
          cache: npm
          cache-dependency-path: website/site/package-lock.json
      - run: npm ci
      # Non-blocking for now: flags high/critical production-dependency
      # advisories without failing the build. Revisit once the pending
      # Dependabot bumps in this PR have merged and the baseline is clean.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # gitleaks-action v2, resolved 2026-09-22
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
